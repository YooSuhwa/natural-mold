name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # --all-extras: ruff lives in [project.optional-dependencies].dev,
      # not in the default dev dependency-group.
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - name: Resolve changed-file base
        env:
          QUALITY_EVENT_NAME: "${{ github.event_name }}"
          QUALITY_PR_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          QUALITY_PUSH_BEFORE_SHA: "${{ github.event.before }}"
          QUALITY_DEFAULT_BRANCH: "${{ github.event.repository.default_branch }}"
        run: |
          quality_base="$(uv run python scripts/resolve_quality_base.py)"
          printf 'QUALITY_BASE_SHA=%s\n' "$quality_base" >> "$GITHUB_ENV"
      - name: Changed Python type ratchet
        run: uv run python scripts/check_changed_python_types.py --base "$QUALITY_BASE_SHA"
      - name: Changed Python format ratchet
        run: uv run python scripts/check_changed_python_format.py --base "$QUALITY_BASE_SHA"
      # Test suite runs on aiosqlite in-memory — no Postgres service needed.
      # tests/integration/ drives background run workers via asyncio timing;
      # under xdist -n 4 on a 2-core runner those tasks starve and the poll
      # times out (flaky). Run the parallel suite without them, then the
      # integration ones serially. tests/integration/conftest.py auto-applies
      # the `integration` marker to the whole directory, so the serial step
      # must select it explicitly — the trailing `-m` overrides the addopts
      # `-m 'not integration'` filter. Without it everything is deselected
      # and this dir-scoped step fails loudly (exit 5, NO_TESTS_COLLECTED);
      # the *silent* variant is a full-suite `pytest tests/` run, where
      # passing sibling tests mask the deselection with exit 0. Both
      # contracts are pinned by tests/test_integration_marker_hook.py.
      # The canonical serial lane provisions PostgreSQL 16, migrates twice,
      # forces INTEGRATION_DATABASE_URL, verifies exact node execution, and
      # proves owned-resource cleanup from its immutable manifest.
      - run: bash scripts/run-isolated-command.sh --cwd backend -- uv run pytest -q -n 4 --ignore=tests/integration
        working-directory: .
      - name: Enforce reviewed backend coverage floor
        run: uv run python ../scripts/run_coverage_gate.py backend
      - name: Disposable PostgreSQL integration lane
        working-directory: .
        run: |
          bash scripts/run-isolated-postgres-tests.sh all \
            --manifest .omo/evidence/project-restart-consolidated-roadmap/ci-postgres.json
          (cd backend && uv run python ../scripts/check-isolation-cleanup.py \
            ../.omo/evidence/project-restart-consolidated-roadmap/ci-postgres.json)

  # Project-wide Pyright still has a pre-existing backlog (801 errors in the
  # Todo01 evidence baseline), so
  # this job is observability-only (always green, error count in the log)
  # until the backlog is burned down — drop the `|| true` once
  # `uv run pyright` is clean. Tracked in docs/refactoring-plan-2026-07.md
  # (IX-1).
  backend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --all-extras
      - name: pyright (non-blocking backlog)
        run: uv run pyright || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pnpm version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # Workspace install must run from the repo root (single lockfile).
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm lint
      # Custom guards (docs/lint-hardening-plan.md §A) — only guards whose
      # ENFORCING mode is green are wired. Not wired yet: lint:a11y and
      # lint:design-system carry real violations needing component fixes
      # (A-2 / FE-D2 / FE-D4), and lint:frontend-architecture's non-strict
      # mode always exits 0 (no gate value) while its strict mode is red
      # (7 blocking issues in the current baseline) — wire it once those are fixed.
      - run: pnpm lint:i18n
      - run: pnpm lint:type-safety
      - run: pnpm lint:e2e-hygiene
      - run: pnpm exec vitest run
      - name: Enforce reviewed frontend coverage floor
        run: python3 ../scripts/run_coverage_gate.py frontend
      - run: pnpm build

  pr-scripted-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: uv sync --frozen --all-extras
        working-directory: backend
      - run: pnpm install --frozen-lockfile
      - name: Govern skips and run deterministic PR smoke
        run: |
          pnpm --dir frontend lint:e2e-skips
          E2E_RUN_MANIFEST="$PWD/.omo/evidence/project-restart-consolidated-roadmap/ci-pr-smoke.json" \
            pnpm --dir frontend test:e2e:scripted -- --project=scripted-smoke --workers=1
      - name: Validate cleanup and redacted artifact contract
        run: >-
          backend/.venv/bin/python scripts/check-isolation-cleanup.py
          .omo/evidence/project-restart-consolidated-roadmap/ci-pr-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: pr-scripted-smoke
          path: |
            .omo/evidence/project-restart-consolidated-roadmap/ci-pr-smoke.json
            output/e2e-captures/
          if-no-files-found: error
          retention-days: 14
