name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authz-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release download fails during GitHub incidents (504, dropped connections), so the
      # checksum-pinned tarball is cached and only fetched (with retries) on a cache miss.
      - name: Cache OpenFGA CLI 0.8.1
        id: fga-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/openfga/fga_0.8.1_linux_amd64.tar.gz
          key: openfga-cli-0.8.1-e0414ad70850f8070540ad1be7a1e2e861edd6d6e73f6ed2b959c3277f98a54c
      - name: Download OpenFGA CLI 0.8.1
        if: steps.fga-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/openfga
          curl --fail --silent --show-error --location \
            --retry 6 --retry-all-errors --retry-delay 10 --connect-timeout 20 \
            https://github.com/openfga/cli/releases/download/v0.8.1/fga_0.8.1_linux_amd64.tar.gz \
            --output ~/.cache/openfga/fga_0.8.1_linux_amd64.tar.gz
      - name: Install checksum-verified OpenFGA CLI 0.8.1
        run: |
          cp ~/.cache/openfga/fga_0.8.1_linux_amd64.tar.gz "$RUNNER_TEMP/fga.tar.gz"
          printf '%s  %s\n' \
            e0414ad70850f8070540ad1be7a1e2e861edd6d6e73f6ed2b959c3277f98a54c \
            "$RUNNER_TEMP/fga.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/fga.tar.gz" --directory "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/fga" /usr/local/bin/fga
      - name: Verify organization permission model
        run: fga model test --tests backend/app/authz/model.fga.yaml
      - name: Verify SDK model matches the canonical DSL
        run: |
          fga model transform --file backend/app/authz/model.fga > "$RUNNER_TEMP/model.json"
          diff backend/app/authz/model.json "$RUNNER_TEMP/model.json"

  backend:
    runs-on: ubuntu-latest
    # Lint, ratchets and one parallel coverage-measured suite; the PostgreSQL lane
    # runs in backend-postgres. Stop a hung run instead of using the 6 h default.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # Backend isolation tests exercise the real prepared frontend mirror and
      # Next type-generation boundary, so the clean runner needs workspace deps.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # --all-extras: ruff lives in [project.optional-dependencies].dev,
      # not in the default dev dependency-group.
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - name: Authorization ownership predicate ratchet
        run: uv run python ../scripts/check_authz_predicates.py
      - name: Resolve changed-file base
        env:
          QUALITY_EVENT_NAME: "${{ github.event_name }}"
          QUALITY_PR_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          QUALITY_PUSH_BEFORE_SHA: "${{ github.event.before }}"
          QUALITY_DEFAULT_BRANCH: "${{ github.event.repository.default_branch }}"
        run: |
          quality_base="$(uv run python scripts/resolve_quality_base.py)"
          printf 'QUALITY_BASE_SHA=%s\n' "$quality_base" >> "$GITHUB_ENV"
      - name: Changed Python type ratchet
        # The repository-wide type backlog predates this accumulated bootstrap PR.
        # Keep the check visible but non-blocking only for accumulated bootstrap PR #300
        # while the backlog is retired; every other workflow run remains enforcing.
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 300 }}
        run: uv run python scripts/check_changed_python_types.py --base "$QUALITY_BASE_SHA"
      - name: Changed Python format ratchet
        run: uv run python scripts/check_changed_python_format.py --base "$QUALITY_BASE_SHA"
      # Test suite runs on aiosqlite in-memory — no Postgres service needed.
      # tests/integration/ drives background run workers via asyncio timing;
      # under xdist -n 4 on a 2-core runner those tasks starve and the poll
      # times out (flaky). Run the parallel suite without them; backend-postgres
      # runs them serially. tests/integration/conftest.py auto-applies
      # the `integration` marker to the whole directory, so the serial step
      # must select it explicitly — the trailing `-m` overrides the addopts
      # `-m 'not integration'` filter. Without it everything is deselected
      # and this dir-scoped step fails loudly (exit 5, NO_TESTS_COLLECTED);
      # the *silent* variant is a full-suite `pytest tests/` run, where
      # passing sibling tests mask the deselection with exit 0. Both
      # contracts are pinned by tests/test_integration_marker_hook.py.
      # The coverage gate runs that parallel suite itself, once, under pytest-cov:
      # the JSON report is written inside the wrapper-owned isolated root by this
      # run and checked against the reviewed floor, so nothing re-runs the suite.
      - name: Run backend suite and enforce reviewed coverage floor
        working-directory: .
        run: |
          bash scripts/run-isolated-command.sh --cwd backend -- \
            uv run python ../scripts/run_coverage_gate.py backend --workers 4

  # The canonical serial lane provisions PostgreSQL 16, migrates twice,
  # forces INTEGRATION_DATABASE_URL, verifies exact node execution, and
  # proves owned-resource cleanup from its immutable manifest. It runs in
  # parallel with the backend job and needs only the backend environment.
  backend-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --all-extras
      - name: Run disposable PostgreSQL integration lane
        id: postgres_lane
        working-directory: .
        run: |
          bash scripts/run-isolated-postgres-tests.sh all \
            --manifest .omo/evidence/project-restart-consolidated-roadmap/ci-postgres.json
      - name: Validate PostgreSQL integration receipt
        if: ${{ always() && steps.postgres_lane.outcome != 'skipped' }}
        working-directory: backend
        run: |
          uv run python ../scripts/check-isolation-cleanup.py \
            ../.omo/evidence/project-restart-consolidated-roadmap/ci-postgres.json
      - name: Verify PostgreSQL integration cleanup
        if: ${{ always() && steps.postgres_lane.outcome != 'skipped' }}
        working-directory: backend
        run: |
          uv run python ../scripts/check-isolation-cleanup.py \
            --discover ../.omo/evidence/project-restart-consolidated-roadmap
      # A red lane names its failed nodes; only strings shaped like pytest node ids print.
      - name: List failed PostgreSQL lane nodes
        if: ${{ failure() && steps.postgres_lane.outcome == 'failure' }}
        working-directory: .
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          path = pathlib.Path(".omo/evidence/project-restart-consolidated-roadmap/ci-postgres.json")
          node = re.compile(r"tests/[A-Za-z0-9_/]+\.py::[A-Za-z0-9_\[\]\-.]+")
          where = re.compile(r"[A-Za-z0-9_/.\-]+\.py:[0-9]+(: in [A-Za-z0-9_]+|:[A-Za-z]*Error)?")
          error = re.compile(r"[A-Za-z_.]*(Error|Exception|Timeout)")
          data = json.loads(path.read_text()) if path.is_file() else {}
          for scenario in data.get("scenarios", []):
              receipt = scenario.get("test_receipt") or {}
              for item in receipt.get("failed_node_ids", []):
                  if isinstance(item, str) and node.fullmatch(item):
                      print(f"failed node: {item}")
              records = (scenario.get("child_failure_diagnostics") or {}).get("records", [])
              for item in records:
                  if isinstance(item, str) and (where.fullmatch(item) or error.fullmatch(item)):
                      print(f"failure record: {item}")
          PY

  # Project-wide Pyright is a blocking basic-mode gate. Keep standard-mode
  # promotion as a separate decision so the zero-error baseline stays stable.
  backend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen --all-extras
      - name: pyright
        run: uv run pyright

  external-services:
    runs-on: ubuntu-latest
    # The shared MCP runtime's own tests, then the backend against a real runtime and a
    # real S3-compatible server (tests/external/ skips without them).
    timeout-minutes: 20
    env:
      MCP_RUNTIME_TEST_URL: http://127.0.0.1:8096
      MCP_RUNTIME_TEST_SECRET: ci-only-runtime-secret-of-at-least-32-bytes
      STORAGE_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      STORAGE_TEST_S3_KEY: ci-access
      STORAGE_TEST_S3_SECRET: ci-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: mcp-runtime tests
        working-directory: mcp-runtime
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/pyright
          .venv/bin/python -m pytest -q
      - name: Start mcp-runtime
        working-directory: mcp-runtime
        run: |
          MCP_RUNTIME_TOKEN_SECRET="$MCP_RUNTIME_TEST_SECRET" nohup .venv/bin/python -m moldy_mcp_runtime > "$RUNNER_TEMP/runtime.log" 2>&1 &
      - name: Start SeaweedFS
        run: |
          printf '{"identities":[{"name":"ci","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$STORAGE_TEST_S3_KEY" "$STORAGE_TEST_S3_SECRET" > "$RUNNER_TEMP/s3.json"
          docker run -d --name ci-s3 -p 8333:8333 -v "$RUNNER_TEMP/s3.json:/etc/s3.json:ro" chrislusf/seaweedfs:4.48 server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/s3.json
      - name: Wait for both services
        run: |
          for _ in $(seq 60); do
            if curl -fsS http://127.0.0.1:8096/healthz >/dev/null && curl -fsS http://127.0.0.1:8333/healthz >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/runtime.log"; docker logs ci-s3; exit 1
      - run: uv sync --frozen --all-extras
        working-directory: backend
      - name: Backend against the real services (no skips allowed)
        working-directory: backend
        run: |
          uv run pytest -q -rs tests/external | tee "$RUNNER_TEMP/external.txt"
          ! grep -q "skipped" "$RUNNER_TEMP/external.txt"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # pnpm version comes from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      # Workspace install must run from the repo root (single lockfile).
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # Script tests invoke backend/.venv/bin/python through the E2E runner.
      - run: uv sync --frozen --all-extras
        working-directory: backend
      - run: pnpm lint
      # Custom guards (docs/lint-hardening-plan.md §A) — only guards whose
      # ENFORCING mode is green are wired. Not wired yet: lint:a11y carries
      # real violations needing component fixes (A-2), and
      # lint:frontend-architecture's non-strict
      # mode always exits 0 (no gate value) while its strict mode is red
      # (7 blocking issues in the current baseline) — wire it once those are fixed.
      - run: pnpm lint:i18n
      - run: pnpm lint:design-system
      - run: pnpm lint:type-safety
      - run: pnpm lint:e2e-hygiene
      - run: pnpm exec vitest run
      - name: Enforce reviewed frontend coverage floor
        run: python3 ../scripts/run_coverage_gate.py frontend
      - run: pnpm build

  pr-scripted-smoke:
    if: github.event_name == 'pull_request'
    # Pinned: Playwright has no Chromium build for ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: uv sync --frozen --all-extras
        working-directory: backend
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Govern skips and run deterministic PR smoke
        run: |
          pnpm --dir frontend lint:e2e-skips
          E2E_RUN_MANIFEST="$PWD/.omo/evidence/project-restart-consolidated-roadmap/ci-pr-smoke.json" \
            pnpm --dir frontend test:e2e:scripted -- --project=scripted-smoke --workers=1
      - name: Validate cleanup and redacted artifact contract
        id: pr_smoke_artifact_contract
        if: ${{ always() }}
        run: |
          backend/.venv/bin/python scripts/check-isolation-cleanup.py \
            --print-artifact-metadata \
            .omo/evidence/project-restart-consolidated-roadmap/ci-pr-smoke.json \
            >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: >-
          ${{ always() && steps.pr_smoke_artifact_contract.outcome == 'success' &&
              steps.pr_smoke_artifact_contract.outputs.artifact_scope == 'manifest-only' }}
        with:
          name: pr-scripted-smoke
          path: .omo/evidence/project-restart-consolidated-roadmap/ci-pr-smoke.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: >-
          ${{ always() && steps.pr_smoke_artifact_contract.outcome == 'success' &&
              steps.pr_smoke_artifact_contract.outputs.artifact_scope == 'full' }}
        with:
          name: pr-scripted-smoke
          path: |
            .omo/evidence/project-restart-consolidated-roadmap/ci-pr-smoke.json
            ${{ steps.pr_smoke_artifact_contract.outputs.artifact_directory }}
          if-no-files-found: error
          retention-days: 14
