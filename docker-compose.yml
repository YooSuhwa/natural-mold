# Local quickstart: `docker compose up -d --build` brings up the whole stack with
# no .env editing (docs/docker-quickstart.md). Startup order:
#
#   openfga-postgres -> openfga-migrate -> openfga ----------------------+
#   postgres + init-secrets -> migrate (alembic) -> authz-bootstrap -----+-> backend -> frontend
#   init-secrets + skill-sandbox-image -> opensandbox ---------------------+
#   pii-model-fetch -> pii-detector (guardrail Korean model pack; the backend falls back
#   to its rules pack while it is missing)
#
# Settings precedence inside the backend containers, highest first:
#   1. the `environment:` blocks below (shell / root .env interpolation)
#   2. backend/.env, when present (env_file)
#   3. files generated in the moldy_runtime volume, used only for variables still
#      unset or empty after 1 and 2: ENCRYPTION_KEYS and JWT_SECRET (init-secrets,
#      created once and reused; SKILL_SANDBOX_API_KEY is added to an older file),
#      OPENFGA_STORE_ID and OPENFGA_MODEL_ID
#      (authz-bootstrap, refreshed on every `up`).
# Shared or production installs set real OpenFGA secrets in the root .env and
# layer docker-compose.tls.yml on top (docs/operator-setup.md section 7).

x-openfga-datastore-uri: &openfga-datastore-uri postgres://openfga:${OPENFGA_DB_PASSWORD:-moldy-dev-openfga-db}@openfga-postgres:5432/openfga?sslmode=disable

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile

# extra_ca: an optional CA bundle for networks that inspect TLS (MOLDY_BUILD_EXTRA_CA); the
# build uses it to reach the PyTorch CPU index and does not keep it in the image.
x-pii-detector-build: &pii-detector-build
  context: .
  dockerfile: docker/pii-detector/Dockerfile
  secrets:
    - extra_ca

# Fills unset/empty variables from the generated runtime files, then runs the
# service command. MOLDY_DEMO_SCRIPTED_MODEL=true turns on the keyless scripted
# chat model (dev only; the backend ignores it with APP_ENV=production).
x-backend-entrypoint: &backend-entrypoint
  - sh
  - -c
  - |
    set -eu
    for file in /run/moldy/secrets.env /run/moldy/openfga.env; do
      [ -f "$$file" ] || continue
      while IFS='=' read -r key value || [ -n "$$key" ]; do
        case "$$key" in ''|*[!A-Z0-9_]*) continue ;; esac
        if [ -z "$$(printenv "$$key" || true)" ]; then export "$$key=$$value"; fi
      done < "$$file"
    done
    if [ "$${MOLDY_DEMO_SCRIPTED_MODEL:-false}" = true ]; then
      export E2E_SCRIPTED_MODEL_ENABLED=true
    fi
    exec "$$@"
  - moldy-env

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-dev}
  # Point at the `postgres` service, not localhost — these override whatever
  # backend/.env sets for local (uv) development.
  DATABASE_URL: postgresql+asyncpg://moldy:moldy@postgres:5432/moldy
  DATABASE_URL_SYNC: postgresql://moldy:moldy@postgres:5432/moldy
  OPENFGA_API_URL: http://openfga:8080
  OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:-moldy-dev-openfga-token}
  AUTHZ_MODE: ${AUTHZ_MODE:-legacy}
  DB_RLS_ENABLED: ${DB_RLS_ENABLED:-false}
  # Object storage (app/storage/object_store.py): local disk by default; STORAGE_BACKEND=s3
  # with the `s3` profile uses the bundled SeaweedFS, or point the URL and keys elsewhere.
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  STORAGE_S3_ENDPOINT_URL: ${STORAGE_S3_ENDPOINT_URL:-http://s3:8333}
  STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-moldy}
  STORAGE_S3_CREATE_BUCKET: ${STORAGE_S3_CREATE_BUCKET:-true}

# Secrets (ENCRYPTION_KEYS, JWT_SECRET, optional LLM keys) may come from
# backend/.env — the same file the local-dev workflow creates. Optional: without
# it the generated runtime files are used. `environment:` wins over this file.
x-backend-env-file: &backend-env-file
  - path: ./backend/.env
    required: false

services:
  openfga-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openfga
      # Dev default, reachable only inside the Compose network (no host port).
      POSTGRES_PASSWORD: ${OPENFGA_DB_PASSWORD:-moldy-dev-openfga-db}
      POSTGRES_DB: openfga
    volumes:
      - openfga_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga -d openfga"]
      interval: 5s
      timeout: 5s
      retries: 10

  openfga-migrate:
    image: openfga/openfga:v1.22.0
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: *openfga-datastore-uri
    depends_on:
      openfga-postgres:
        condition: service_healthy
    restart: on-failure

  openfga:
    image: openfga/openfga:v1.22.0
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: *openfga-datastore-uri
      OPENFGA_AUTHN_METHOD: preshared
      # Dev default, reachable only inside the Compose network. The TLS overlay
      # refuses to start without a real value.
      OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_API_TOKEN:-moldy-dev-openfga-token}
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_METRICS_ENABLED: "true"
    healthcheck:
      # gRPC health stays plaintext under the TLS overlay (it enables HTTP TLS only).
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=127.0.0.1:8081"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # No host ports: FGA API and metrics are available only in the Compose network.

  # postgres:16-alpine plus the pgvector extension (docker/postgres), for the knowledge search
  # index (feature plan v2 순번 5). Same Alpine base, so existing data volumes stay valid.
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
      secrets:
        - extra_ca
    image: moldy-postgres:local
    environment:
      POSTGRES_USER: moldy
      POSTGRES_PASSWORD: moldy
      POSTGRES_DB: moldy
    ports:
      - "${MOLDY_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moldy"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: generate ENCRYPTION_KEYS, JWT_SECRET and SKILL_SANDBOX_API_KEY into
  # the moldy_runtime volume on first run; later runs keep the existing values, so
  # credentials stay decryptable and sessions survive restarts, and only add a key
  # the file does not have yet. `down -v` deletes it.
  init-secrets:
    build: *backend-build
    entrypoint: ["python", "-c"]
    command:
      - |
        import os, secrets
        path = "/run/moldy/secrets.env"
        values = {
            "ENCRYPTION_KEYS": lambda: secrets.token_hex(32),
            "JWT_SECRET": lambda: secrets.token_urlsafe(64),
            "SKILL_SANDBOX_API_KEY": lambda: secrets.token_urlsafe(32),
            # Keys of the bundled S3 server (`s3` profile); a company S3 set in the
            # environment takes precedence, like every value in this file.
            "STORAGE_S3_ACCESS_KEY_ID": lambda: "moldy" + secrets.token_hex(8),
            "STORAGE_S3_SECRET_ACCESS_KEY": lambda: secrets.token_urlsafe(32),
        }
        lines = open(path).read().splitlines() if os.path.exists(path) else []
        present = {line.split("=", 1)[0] for line in lines if "=" in line}
        missing = [key for key in values if key not in present]
        if not missing:
            print("init-secrets: reusing", path)
        else:
            os.umask(0o077)
            with open(path + ".tmp", "w") as out:
                out.writelines(f"{line}\n" for line in lines)
                out.writelines(f"{key}={values[key]()}\n" for key in missing)
            os.replace(path + ".tmp", path)
            print("init-secrets: generated", ", ".join(missing), "in", path)
    volumes:
      - moldy_runtime:/run/moldy

  # Builds the image every skill sandbox starts from (docker/skill-sandbox); the
  # opensandbox server starts containers from it, so it only has to exist locally.
  skill-sandbox-image:
    build:
      context: .
      dockerfile: docker/skill-sandbox/Dockerfile
    image: moldy-skill-sandbox:local
    entrypoint: ["true"]

  # Isolated skill execution (docs/design-docs/skill-sandbox-docker.md): one
  # throwaway sandbox container per execute_in_skill call. It starts containers
  # through the Docker socket, which gives this service control of the Docker host;
  # it publishes no host port and the backend reaches it inside the Compose network.
  # Sandboxes run on Docker's default bridge (egress policy works only there); the
  # server joins that network at start to reach them, so the backend does not.
  opensandbox:
    build:
      context: .
      dockerfile: docker/opensandbox/Dockerfile
    entrypoint: *backend-entrypoint
    command:
      - sh
      - -c
      - OPENSANDBOX_SERVER_API_KEY="$$SKILL_SANDBOX_API_KEY" exec python /opt/opensandbox/start.py
    env_file: *backend-env-file
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - opensandbox_data:/var/lib/opensandbox
      - moldy_runtime:/run/moldy:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=4)
      interval: 5s
      timeout: 5s
      retries: 20
      # The first start pulls the execd and egress images (start.py).
      start_period: 300s
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      skill-sandbox-image:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: download the pinned schift-ko-pii-v7 checkpoint (docker/pii-detector/
  # model_files.py) into the pii_model volume on first run. A failed download exits 0 so
  # the stack still starts; see docs/docker-quickstart.md to copy a downloaded folder in.
  pii-model-fetch:
    build: *pii-detector-build
    image: moldy-pii-detector:local
    command: ["python", "/opt/pii-detector/fetch.py"]
    volumes:
      - pii_model:/models

  # Guardrail Korean model pack (docs/design-docs/guardrail-minimum-plan.md §2). It loads
  # only the pinned files, publishes no host port, and gets no secrets.
  pii-detector:
    image: moldy-pii-detector:local
    volumes:
      - pii_model:/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/healthz', timeout=4)
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      pii-model-fetch:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: Alembic owns the schema (there is no create_all), so the database
  # is migrated before the backend's lifespan seed queries it. Idempotent.
  migrate:
    build: *backend-build
    entrypoint: *backend-entrypoint
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment: *backend-environment
    env_file: *backend-env-file
    volumes:
      - moldy_runtime:/run/moldy:ro
    depends_on:
      postgres:
        condition: service_healthy
      init-secrets:
        condition: service_completed_successfully

  # One-shot `authz bootstrap` (org-authz plan 15.1): find or create the store,
  # deploy the model (reused when unchanged), write the expected tuples, and pin
  # the ids into moldy_runtime/openfga.env so the outbox/reconcile jobs schedule
  # once AUTHZ_MODE leaves legacy. Ids pinned in backend/.env take precedence.
  authz-bootstrap:
    build: *backend-build
    entrypoint: *backend-entrypoint
    command:
      - sh
      - -c
      - |
        set -eu
        uv run --no-sync python -m app.authz.cli bootstrap > /tmp/bootstrap.json
        uv run --no-sync python - <<'PY'
        import json, os
        lines = [line for line in open("/tmp/bootstrap.json") if line.lstrip().startswith("{")]
        result = json.loads(lines[-1])
        model, tuples = result["model"], result["tuples"]
        with open("/run/moldy/openfga.env.tmp", "w") as out:
            out.write(f"OPENFGA_STORE_ID={model['store_id']}\n")
            out.write(f"OPENFGA_MODEL_ID={model['model_id']}\n")
        os.replace("/run/moldy/openfga.env.tmp", "/run/moldy/openfga.env")
        print(
            f"authz-bootstrap: pinned store_id={model['store_id']} model_id={model['model_id']}"
            f" model_changed={model['changed']} expected_tuples={tuples['expected']}"
        )
        PY
    environment:
      <<: *backend-environment
      MIGRATION_DATABASE_URL: postgresql+asyncpg://moldy:moldy@postgres:5432/moldy
    env_file: *backend-env-file
    volumes:
      - moldy_runtime:/run/moldy
    depends_on:
      migrate:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy

  # Bundled S3-compatible storage (SeaweedFS, Apache-2.0; decision D19), only with
  # `--profile s3`. Credentials come from init-secrets; it publishes no host port.
  s3:
    image: chrislusf/seaweedfs:4.48
    profiles: ["s3"]
    entrypoint: *backend-entrypoint
    command:
      - sh
      - -c
      - |
        umask 077
        printf '{"identities":[{"name":"moldy","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$STORAGE_S3_ACCESS_KEY_ID" "$$STORAGE_S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - s3_data:/data
      - moldy_runtime:/run/moldy:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      init-secrets:
        condition: service_completed_successfully
    restart: unless-stopped

  # Generic background jobs (app/jobs): a separate process that claims due jobs from the
  # jobs table and runs them in each job's company session. More replicas share the
  # queue safely (FOR UPDATE SKIP LOCKED); a stopped worker's jobs are taken again.
  worker:
    build: *backend-build
    entrypoint: *backend-entrypoint
    command: ["uv", "run", "--no-sync", "python", "-m", "app.jobs.worker"]
    environment: *backend-environment
    env_file: *backend-env-file
    volumes:
      - backend_data:/app/data
      - moldy_runtime:/run/moldy:ro
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  backend:
    build: *backend-build
    entrypoint: *backend-entrypoint
    command:
      ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${MOLDY_BACKEND_PORT:-8001}:8000"
    environment:
      <<: *backend-environment
      CHECKPOINTER_POOL_MIN_SIZE: ${CHECKPOINTER_POOL_MIN_SIZE:-4}
      CHECKPOINTER_POOL_MAX_SIZE: ${CHECKPOINTER_POOL_MAX_SIZE:-20}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${MOLDY_FRONTEND_PORT:-3000},http://127.0.0.1:${MOLDY_FRONTEND_PORT:-3000}}
      MOLDY_DEMO_SCRIPTED_MODEL: ${MOLDY_DEMO_SCRIPTED_MODEL:-false}
      # Skill scripts run in throwaway sandboxes; false runs them in this container.
      SKILL_SANDBOX_ENABLED: ${SKILL_SANDBOX_ENABLED:-true}
      SKILL_SANDBOX_DOMAIN: opensandbox:8090
      SKILL_SANDBOX_USE_SERVER_PROXY: "true"
      SKILL_SANDBOX_IMAGE: moldy-skill-sandbox:local
      # Empty runs the guardrail Korean rules pack only.
      GUARDRAIL_PII_MODEL_URL: ${GUARDRAIL_PII_MODEL_URL-http://pii-detector:8095}
    env_file: *backend-env-file
    volumes:
      # Persist skills, uploads, artifacts, and agent images across recreation.
      - backend_data:/app/data
      - moldy_runtime:/run/moldy:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      openfga:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      authz-bootstrap:
        condition: service_completed_successfully
      # Not healthy: without the server only skill scripts fail; chat still works.
      opensandbox:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined into the browser bundle at build time, so the
        # API URL must be set HERE — a runtime env var alone never reaches the
        # client. Override for remote deploys, e.g. https://api.example.com.
        # Changing it (or MOLDY_BACKEND_PORT) needs `up -d --build`.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${MOLDY_BACKEND_PORT:-8001}}
        NEXT_PUBLIC_CHAT_RUNTIME: ${NEXT_PUBLIC_CHAT_RUNTIME:-langgraph_v3}
    ports:
      - "${MOLDY_FRONTEND_PORT:-3000}:3000"
    environment:
      # Kept in step with the build arg. The Next server itself never calls the
      # backend; pages fetch it from the browser.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${MOLDY_BACKEND_PORT:-8001}}
      NEXT_PUBLIC_CHAT_RUNTIME: ${NEXT_PUBLIC_CHAT_RUNTIME:-langgraph_v3}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  s3_data:
  postgres_data:
  backend_data:
  openfga_data:
  # Generated secrets.env and openfga.env (see init-secrets and authz-bootstrap).
  moldy_runtime:
  opensandbox_data:
  # The pinned schift-ko-pii-v7 checkpoint (pii-model-fetch).
  pii_model:

secrets:
  extra_ca:
    file: ${MOLDY_BUILD_EXTRA_CA:-/dev/null}
