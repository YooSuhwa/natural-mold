services:
  openfga-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: ${OPENFGA_DB_PASSWORD:?Set OPENFGA_DB_PASSWORD}
      POSTGRES_DB: openfga
    volumes:
      - openfga_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga -d openfga"]
      interval: 5s
      timeout: 5s
      retries: 10

  openfga-migrate:
    image: openfga/openfga:v1.22.0
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD:?Set OPENFGA_DB_PASSWORD}@openfga-postgres:5432/openfga?sslmode=disable
    depends_on:
      openfga-postgres:
        condition: service_healthy
    restart: on-failure

  openfga:
    image: openfga/openfga:v1.22.0
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:${OPENFGA_DB_PASSWORD:?Set OPENFGA_DB_PASSWORD}@openfga-postgres:5432/openfga?sslmode=disable
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${OPENFGA_API_TOKEN:?Set OPENFGA_API_TOKEN}
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_METRICS_ENABLED: "true"
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # No host ports: FGA API and metrics are available only in the Compose network.

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moldy
      POSTGRES_PASSWORD: moldy
      POSTGRES_DB: moldy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moldy"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Run migrations before serving so a fresh database has its tables before
    # the lifespan seed queries them (there is no create_all — Alembic owns the
    # schema). `alembic upgrade head` is idempotent, so this is safe on restart.
    command:
      - sh
      - -c
      - uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      # Point at the `postgres` service, not localhost — these override whatever
      # backend/.env sets for local (uv) development.
      DATABASE_URL: postgresql+asyncpg://moldy:moldy@postgres:5432/moldy
      DATABASE_URL_SYNC: postgresql://moldy:moldy@postgres:5432/moldy
      CHECKPOINTER_POOL_MIN_SIZE: ${CHECKPOINTER_POOL_MIN_SIZE:-4}
      CHECKPOINTER_POOL_MAX_SIZE: ${CHECKPOINTER_POOL_MAX_SIZE:-20}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      OPENFGA_API_URL: http://openfga:8080
      OPENFGA_API_TOKEN: ${OPENFGA_API_TOKEN:?Set OPENFGA_API_TOKEN}
      AUTHZ_MODE: ${AUTHZ_MODE:-legacy}
      DB_RLS_ENABLED: ${DB_RLS_ENABLED:-false}
    # Secrets (ENCRYPTION_KEYS, JWT_SECRET, optional LLM keys) are read from
    # backend/.env — the same file the local-dev workflow creates. Marked
    # optional so `docker compose up postgres -d` keeps working before the
    # file exists. The environment block above takes precedence over it.
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      # Persist skills, uploads, artifacts, and agent images across recreation.
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      openfga:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # NEXT_PUBLIC_* is inlined into the browser bundle at build time, so the
        # API URL must be set HERE — a runtime env var alone never reaches the
        # client. Override for remote deploys, e.g. https://api.example.com
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8001}
        NEXT_PUBLIC_CHAT_RUNTIME: ${NEXT_PUBLIC_CHAT_RUNTIME:-langgraph_v3}
    ports:
      - "3000:3000"
    environment:
      # Runtime value for server-side (SSR) fetches; the client bundle uses the
      # build arg above.
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8001}
      NEXT_PUBLIC_CHAT_RUNTIME: ${NEXT_PUBLIC_CHAT_RUNTIME:-langgraph_v3}
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_data:
  openfga_data:
